{% extends 'base.html' %}

{% block title %}Contact Us{% endblock %}

{% block content %}
    <div class="card-container compact-card">
        <form method="post" action="{% url 'ContactSave1' %}">
            {% csrf_token %}
            <fieldset>
                <h2>Contact Us</h2>
                {% if msg and msg != "pp" and msg != "None" and msg != "" %}
                    <div class="alert-banner {% if 'Successfully' in msg or 'Saved' in msg or 'Updated' in msg %}success{% else %}error{% endif %}">
                        {{ msg }}
                    </div>
                {% endif %}
                <hr>
                <div class="form-grid">
                    <div class="form-field">
                        <label>Serial No.</label>
                        <input type="text" name="Slno" readonly placeholder="Auto-generated" class="form-control">
                    </div>
                    <div class="form-field">
                        <label>Company/Your Name</label>
                        <input type="text" name="ComName" value="{{ donor_name|default:'' }}" required maxlength="50" class="form-control">
                    </div>
                    <div class="form-field">
                        <label>Email Id</label>
                        <input type="email" name="ComEmail" value="{{ donor_email|default:'' }}" required maxlength="50" class="form-control">
                    </div>
                    <div class="form-field">
                        <label>Mobile No.</label>
                        <input type="tel" name="ComMob" value="{{ donor_mob|default:'' }}" maxlength="15" pattern="[0-9]{10,15}" title="Enter a valid 10-15 digit phone number" class="form-control">
                    </div>
                    <div class="form-field full-width">
                        <label>Address</label>
                        <textarea name="ComAdd" rows="2" class="form-control">{{ donor_add|default:'' }}</textarea>
                    </div>
                    <div class="form-field full-width">
                        <label>Remarks</label>
                        <textarea name="Remarks" rows="2" class="form-control"></textarea>
                    </div>
                </div>
                
                <div class="btn-group">
                    <input type="submit" value="Save" class="btn btn-primary">
                    <input type="reset" value="Reset" class="btn btn-reset">
                </div>
            </fieldset>
        </form>
    </div>
{% endblock %}
