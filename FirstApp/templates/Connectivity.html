{% extends 'base.html' %}

{% block title %}Connectivity Status{% endblock %}

{% block content %}
    <div class="card-container">
        <fieldset>
            <h2>Database Connection Status</h2>
            <hr>
            <div class="{% if 'Successfully' in msg %}connection-success{% else %}connection-error{% endif %}">
                {{ msg }}
            </div>
        </fieldset>
    </div>
{% endblock %}
